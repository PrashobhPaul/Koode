# Koode server push (Firebase Cloud Messaging) — optional.
#
# Push is what wakes a follower's Koode when the app is CLOSED, so every
# person the traveller chose gets every journey update as it happens.
# Without these values the app builds and runs exactly as before: followers
# are updated by the in-app follow service while Koode is running.
#
# Where the values come from (no command line needed):
#   Firebase console -> your project -> Project settings -> General ->
#   "Your apps" -> the Android app with package  app.koode  ->
#   download google-services.json. The four values are inside it:
#     FIREBASE_PROJECT_ID  = project_info.project_id
#     FIREBASE_SENDER_ID   = project_info.project_number
#     FIREBASE_APP_ID      = client[0].client_info.mobilesdk_app_id
#     FIREBASE_API_KEY     = client[0].api_key[0].current_key
#
# These are client identifiers, public by design (they ship inside every
# APK); they grant nothing on their own. The private sending credential
# lives only on the server (Supabase Edge Function secret FCM_SERVICE_ACCOUNT).

FIREBASE_PROJECT_ID=koode-ec4aa
FIREBASE_SENDER_ID=325977029310
FIREBASE_APP_ID=1:325977029310:android:39218be7652dd67f5afcef
FIREBASE_API_KEY=AIzaSyDv8rbS0QVNc5K3pL-Sq5BlqmMV0S_9Ew8
