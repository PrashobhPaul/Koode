# TripPulse cloud backend (Supabase) — the ONLY configuration in the project.
#
# 1. Create a free project at https://supabase.com (any name, any region).
# 2. In the project: SQL Editor -> paste the whole of supabase/schema.sql -> Run.
# 3. In the project: Settings -> API -> copy "Project URL" and the "anon public"
#    key into the two lines below, commit, and push. CI rebuilds and publishes
#    the APK automatically; nothing else to do, ever.
#
# The anon key is designed to be public — it grants access only to the RPC
# functions in supabase/schema.sql, which enforce all read/write rules
# themselves. Leave both values empty to build in LOCAL mode.

SUPABASE_URL=
SUPABASE_ANON_KEY=
