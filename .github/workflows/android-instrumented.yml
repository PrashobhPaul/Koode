name: Instrumented tests (emulator)

# The unit-test job proves the pure logic. This one proves the two things a
# JVM cannot: the Room migration against real SQLite, and the device reads on
# an actual Android runtime — as close to the family's Motorola and Samsung
# phones as CI can get. It runs on a version tag and on demand, not on every
# push, because an emulator boot is minutes of runner time.
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

# Cancel a superseded run so two tags in a row do not queue two emulators.
concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: connectedCheck on API ${{ matrix.api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two real platform levels: 34 is what current Motorola/Samsung ship;
        # 28 is old enough to prove the pre-Android-11 paths the migrations and
        # the SIM/JSON code deliberately guard for.
        api: [ 28, 34 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          # A plain AOSP image — the closest public stand-in for an OEM device;
          # the platform behaviours these tests check (IMEI/MAC withholding,
          # SIM state, SQLite migrations) are AOSP-level, not OEM-specific.
          target: default
          disable-animations: true
          working-directory: apps/android
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-results-api-${{ matrix.api }}
          path: apps/android/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
