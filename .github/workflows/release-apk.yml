name: Release APK

# Builds the installable, signed APK and publishes it as a GitHub Release so
# the in-app updater and the README link always serve the newest build:
#   https://github.com/PrashobhPaul/Koode/releases/latest/download/Koode.apk
#
# Fires only on a version tag (v6.3.1, v6.4.0, …). Pushing to main no longer
# cuts a release — a release is a deliberate act, marked by a tag.
#
# Signing: if the repository has the KEYSTORE_BASE64 / *_PASSWORD / KEY_ALIAS
# secrets, the APK is signed with that private key. Otherwise it falls back to
# the committed open keystore, which signs every build identically so an
# in-place update never makes a family reinstall (and lose a live journey).
# See docs/RELEASE.md.
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Assemble signed release APK and run unit tests
        working-directory: apps/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Stage APK under its download name
        # Koode.apk is the name the in-app updater and the README both expect.
        # TripPulse.apk is kept so links shared before the rename keep working.
        run: |
          SRC=apps/android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC" || { echo "release APK not found at $SRC"; exit 1; }
          cp "$SRC" Koode.apk
          cp "$SRC" TripPulse.apk

      - name: Record the signing certificate
        # Printed into the release notes so anyone can confirm an update is
        # signed by the same key as their install — the family's tamper check.
        run: |
          FP=$(keytool -printcert -jarfile Koode.apk 2>/dev/null | grep 'SHA-256:' | head -1 || true)
          echo "CERT_FP=$FP" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, use the tag. On a manual run, fall back to a build tag.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Koode build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Koode — Always with you.** Installable, signed APK.

            **Install / update:** download `Koode.apk` below on your Android
            phone, open it, and allow installing from unknown sources when
            prompted. Updating over an existing Koode keeps every journey and
            setting — the app is signed with a stable key so Android accepts
            the update in place.

            Signing certificate (should match your installed copy):
            `${{ env.CERT_FP }}`
          files: |
            Koode.apk
            TripPulse.apk
