name: Release APK

# Builds the installable APK and publishes it as the repository's latest
# GitHub Release, so the README download link always serves the newest build:
#   https://github.com/PrashobhPaul/TripPulse/releases/latest/download/TripPulse.apk
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Assemble APK and run unit tests
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Stage APK with a friendly name
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk TripPulse.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TripPulse build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Installable TripPulse APK (debug-signed, for family & friends testing).

            **Install:** download `TripPulse.apk` below on your Android phone, open it,
            and allow installing from unknown sources when prompted.
          files: TripPulse.apk
