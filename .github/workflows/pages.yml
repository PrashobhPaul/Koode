name: Publish web viewer

# The web tracker (web/) is how people who never install the app, often
# elderly parents, follow a journey at https://prashobhpaul.github.io/Koode/.
# It is not the marketing page (that is the README) and it must never go
# down or go stale. So this workflow:
#   - publishes on EVERY push to main, whatever changed, after every transit
#     data rebuild (whose commits do not trigger pushes), and every six hours;
#   - checks the page before publishing (it is the tracker, its files are
#     all there, its scripts parse and run without errors in a real browser,
#     and it can reach the backend). A failed check publishes nothing, so
#     the last good tracker stays live;
#   - checks the live site after publishing, and fails loudly if it does not
#     serve the tracker.
on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: [ "Transit data" ]
    types: [ completed ]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer one waits rather than cancelling a deploy half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate config.js from supabase.properties
        run: bash tools/web/write-config.sh

      - name: Check the tracker (files, scripts, backend config)
        run: node tools/web/check.mjs --config

      - name: Open the tracker in a browser (no script errors)
        run: |
          mkdir -p "$RUNNER_TEMP/webcheck" && cd "$RUNNER_TEMP/webcheck"
          echo '{}' > package.json
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node "$GITHUB_WORKSPACE/tools/web/smoke.mjs" --web="$GITHUB_WORKSPACE/web"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Check the live tracker
        env:
          PAGE: ${{ steps.deploy.outputs.page_url }}
        run: |
          PAGE="${PAGE%/}/"
          for i in $(seq 1 12); do
            html=$(curl -fsSL --max-time 20 "$PAGE?check=$GITHUB_RUN_ID" || true)
            cfg=$(curl -fsSL --max-time 20 "${PAGE}config.js?check=$GITHUB_RUN_ID" || true)
            js=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 20 "${PAGE}app.js?check=$GITHUB_RUN_ID" || true)
            if echo "$html" | grep -qi '<title>[^<]*follow a journey' && echo "$cfg" | grep -q 'supabase.co' && [ "$js" = "200" ]; then
              echo "Live tracker OK at $PAGE"; exit 0
            fi
            echo "Live tracker not ready yet (try $i); waiting"; sleep 15
          done
          echo "::error::The live site at $PAGE does not serve the journey tracker"
          exit 1
