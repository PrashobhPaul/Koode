name: Publish web viewer

# The browser viewer exists so somebody who will never install an app can still
# follow a journey. Publishing it from the same commit as the APK keeps the two
# in step, and regenerating config.js from supabase.properties means the backend
# settings can never drift between the app and the page.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'web/**'
      - 'apps/android/supabase.properties'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.js from supabase.properties
        run: |
          URL=$(grep '^SUPABASE_URL=' apps/android/supabase.properties | cut -d= -f2- | tr -d ' \r')
          KEY=$(grep '^SUPABASE_ANON_KEY=' apps/android/supabase.properties | cut -d= -f2- | tr -d ' \r')
          cat > web/config.js <<CONFIG
          /* Generated by .github/workflows/pages.yml — do not edit by hand. */
          window.KOODE_CONFIG = {
            SUPABASE_URL: "$URL",
            SUPABASE_ANON_KEY: "$KEY"
          };
          CONFIG
          echo "Wrote web/config.js for $URL"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
